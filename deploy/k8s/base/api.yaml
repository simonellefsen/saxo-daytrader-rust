apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytrader-api
  labels:
    app: daytrader-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytrader-api
  template:
    metadata:
      labels:
        app: daytrader-api
    spec:
      containers:
        - name: api
          image: daytrader-api:local
          imagePullPolicy: IfNotPresent
          command:
            - /app/saxo-rust
          env:
            - name: DAYTRADER_CONFIG
              value: /app/config/config.yaml
            - name: BIND_ADDR
              value: 0.0.0.0:8000
            - name: SAXO_SESSION_PATH
              value: /tmp/daytrader/saxo_session.json
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daytrader-postgres-app
                  key: database-url
          envFrom:
            - secretRef:
                name: daytrader-env
                optional: true
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: daytrader-config
        - name: tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: daytrader-api
spec:
  selector:
    app: daytrader-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: daytrader-frontend
spec:
  selector:
    app: daytrader-api
  ports:
    - name: http
      port: 8000
      targetPort: http
