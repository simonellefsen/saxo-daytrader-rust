apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  labels:
    app: hermes-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-daytrader-context
  labels:
    app: hermes-agent
data:
  DAYTRADER_CAPABILITIES.md: |
    # Daytrader Capabilities

    Hermes is running beside the `saxo` day/swing trading app in the
    `saxo` Kubernetes namespace.

    Hermes may observe, reflect, summarize, and propose changes. It must not
    directly place Saxo orders, approve live orders, read Saxo session tokens,
    mutate Kubernetes secrets, or activate strategies without the app's approval
    flow.

    Current app capabilities:

    - Rust Axum HTTP/API server and Dioxus SSR dashboard.
    - Rust scheduler heartbeat and OpenRouter decision report submission.
    - Two scheduled decision-report pulses when markets are open: Nordic/EU
      open +1h15 and US open +1h15.
    - Daily end-of-day strategy journal reports after the configured local
      journal time.
    - Daily Markov method regime signals for portfolio and watchlist assets.
    - Trading Manager queue creation from completed decision reports.
    - Trading Manager can request per-decision-report Hermes advice through
      the MCP `create_decision_advice` tool before queueing orders. Default
      mode is record-only; conservative mode can only block, reduce, or require
      review.
    - Saxo order precheck and placement for approved queued orders.
    - Strategy journal entries, scheduler cycles, execution orders, events, and
      fills persisted in the daytrader database.
    - Durable Saxo OAuth session storage in `saxo_sessions`, which Hermes must
      not read or expose.

    Useful internal endpoints:

    - `http://daytrader-api.saxo:8000/api/health`
    - `http://daytrader-mcp.saxo:8610/mcp`
    - `http://daytrader-api.saxo:8000/api/overview`
    - `http://daytrader-api.saxo:8000/api/hermes/capabilities`
    - `http://daytrader-api.saxo:8000/api/hermes/context`
    - `http://daytrader-api.saxo:8000/api/hermes/reflections`
    - `http://daytrader-api.saxo:8000/api/hermes/experiments`
    - `http://daytrader-api.saxo:8000/api/decision/latest`
    - `http://daytrader-api.saxo:8000/api/decision/reports`
    - `http://daytrader-api.saxo:8000/api/markov/signals`
    - `http://daytrader-api.saxo:8000/api/scheduler`
    - `http://daytrader-api.saxo:8000/api/execution`
    - `http://daytrader-api.saxo:8000/api/strategy-journal`

    The `/api/hermes/*` endpoints require `x-hermes-api-key` or
    `Authorization: Bearer ...` using `HERMES_DAYTRADER_API_KEY`.
    The `daytrader-mcp` endpoint uses the same bearer key and exposes only
    Hermes-safe tools.

    Read the repository wiki for maintained project knowledge:

    - `wiki/index.md`
    - `wiki/schema.md`
    - `docs/hermes-agent.md`
    - `docs/project-wiki.md`
  SELF_IMPROVEMENT_GOAL.yaml: |
    hermes_self_improvement:
      enabled: true
      mode: recommend_only
      goal_version: 2
      objective:
        target_return_30d: 0.0117
        target_return_note: "Approximately +15% per year compounded monthly: 1.0117^12 ~= 1.15"
        max_drawdown: 0.20
        min_sharpe: 1.0
        failure_below_30d_return: -0.02
        reflection_every: 7d
        one_variable_only: true
      constraints:
        max_positions: 25
        slippage_tolerance: 0.02
        gas_reserve: 0.05
        min_cash_buffer_pct: 0.02
        allow_shorting: false
        require_human_approval: true
        require_backtest_before_activation: true
        require_paper_or_sim_observation: true
      experiment_policy:
        proposal_requirement: "Turn concrete learnings into pending-review one-variable proposals instead of stopping at narrative reflection."
        daily: "Create at most one proposal when same-day evidence is specific, safe to test, and not a duplicate."
        weekly: "Create one proposal when weekly evidence is sufficient and no duplicate active/pending proposal exists."
        supported_variables:
          - execution.min_trade_value_dkk
          - strategy.capital.min_cash_buffer_pct
          - strategy.swing.daily_indicators.min_confluences
          - strategy.swing.markov_gate.min_signed_signal
      forbidden:
        - read_saxo_sessions
        - expose_tokens_or_account_keys
        - place_or_approve_live_orders
        - mutate_kubernetes_secrets
        - activate_strategy_without_approval
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytrader-mcp
  labels:
    app: daytrader-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytrader-mcp
  template:
    metadata:
      labels:
        app: daytrader-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: daytrader-api:local
          imagePullPolicy: IfNotPresent
          command:
            - /app/saxo-rust
            - --mcp-http
          env:
            - name: DAYTRADER_CONFIG
              value: /app/config/config.yaml
            - name: BIND_ADDR
              value: 0.0.0.0:8610
            - name: SAXO_SESSION_PATH
              value: /tmp/daytrader/saxo_session.json
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daytrader-postgres-app
                  key: database-url
          envFrom:
            - secretRef:
                name: daytrader-env
                optional: true
          ports:
            - name: mcp
              containerPort: 8610
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: daytrader-config
        - name: tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: daytrader-mcp
  labels:
    app: daytrader-mcp
spec:
  selector:
    app: daytrader-mcp
  ports:
    - name: mcp
      port: 8610
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-daytrader-mcp
          image: curlimages/curl:8.17.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 60); do
                if curl -fsS http://daytrader-mcp.saxo:8610/health >/dev/null; then
                  exit 0
                fi
                sleep 2
              done
              echo "daytrader-mcp did not become ready before Hermes startup" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent@sha256:b6e41c155d6bfce5ad83c5d0fec670086db8a43250e4511c9474134be5482d33
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
            - |
              if [ -n "${HERMES_MODEL:-}" ]; then
                /opt/hermes/.venv/bin/python /opt/hermes/hermes config set model.default "$HERMES_MODEL" || true
              fi
              if [ -n "${HERMES_INFERENCE_PROVIDER:-}" ]; then
                /opt/hermes/.venv/bin/python /opt/hermes/hermes config set model.provider "$HERMES_INFERENCE_PROVIDER" || true
              fi
              if [ -n "${HERMES_DAYTRADER_API_KEY:-}" ]; then
                /opt/hermes/.venv/bin/python - <<'PY' || true
              import os
              from pathlib import Path

              import yaml

              path = Path("/opt/data/config.yaml")
              data = {}
              if path.exists():
                  data = yaml.safe_load(path.read_text()) or {}
              servers = data.setdefault("mcp_servers", {})
              servers["daytrader"] = {
                  "url": os.environ.get("DAYTRADER_MCP_URL", "http://daytrader-mcp.saxo:8610/mcp"),
                  "headers": {
                      "Authorization": f"Bearer {os.environ['HERMES_DAYTRADER_API_KEY']}"
                  },
                  "timeout": 30,
                  "connect_timeout": 5,
                  "supports_parallel_tool_calls": False,
                  "tools": {
                      "include": [
                          "get_app_capabilities",
                          "get_goal_contract",
                          "get_context",
                          "get_decision_reports",
                          "get_end_of_day_reports",
                          "get_markov_signals",
                          "get_quiver_signals",
                          "list_reflections",
                          "create_reflection",
                          "list_experiments",
                          "create_experiment_proposal",
                          "create_decision_advice",
                      ],
                      "resources": False,
                      "prompts": False,
                  },
              }
              path.write_text(yaml.safe_dump(data, sort_keys=False))
              PY
              fi
              exec /opt/hermes/.venv/bin/python /opt/hermes/hermes gateway run
          envFrom:
            - secretRef:
                name: hermes-env
                optional: true
          ports:
            - name: gateway
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: dev-shm
              mountPath: /dev/shm
            - name: daytrader-context
              mountPath: /opt/daytrader-context
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: tmp
          emptyDir: {}
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: daytrader-context
          configMap:
            name: hermes-daytrader-context
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-gateway
  labels:
    app: hermes-agent
spec:
  selector:
    app: hermes-agent
  ports:
    - name: gateway
      port: 8642
      targetPort: gateway
    - name: dashboard
      port: 9119
      targetPort: dashboard
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-daily-reflection
  labels:
    app: hermes-agent
    component: reflection
    cadence: daily
spec:
  schedule: "45 23 * * 1-5"
  timeZone: Europe/Copenhagen
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: hermes-agent
            component: reflection
            cadence: daily
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
            - name: submit-reflection
              image: curlimages/curl:8.17.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: hermes-env
                    optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -ec
                - |
                  if [ -z "${API_SERVER_KEY:-}" ]; then
                    echo "API_SERVER_KEY is required; set HERMES_API_SERVER_KEY in .env and redeploy." >&2
                    exit 1
                  fi
                  if [ -z "${HERMES_DAYTRADER_API_KEY:-}" ]; then
                    echo "HERMES_DAYTRADER_API_KEY is required for the daytrader adapter." >&2
                    exit 1
                  fi
                  DAYTRADER_API_BASE_URL="${DAYTRADER_API_BASE_URL:-http://daytrader-api.saxo:8000}"
                  RUN_DATE="$(date -u +%Y-%m-%d)"
                  RUN_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  SOURCE_SESSION_ID="daily-eod-reflection-${RUN_DATE}"
                  WAIT_SECONDS="${HERMES_REFLECTION_WAIT_SECONDS:-90}"
                  cat > /tmp/hermes-run.json <<EOF
                  {
                    "session_id": "saxo-daytrader-daily-eod-reflection",
                    "input": "Run the saxo daytrader daily end-of-day learning and proposal loop. Prefer the configured daytrader MCP tools: get_context, get_decision_reports, get_end_of_day_reports, get_markov_signals, get_quiver_signals, list_experiments, create_reflection, and create_experiment_proposal. Analyze today's two decision-report pulses, the daily end-of-day report, Markov regime signals, Quiver alternative-data signals, scheduler cycle status, execution outcomes, failures, current performance, and recent active/pending experiments against the goal contract. Read the read-only gate_replay section from get_context when comparing a threshold hypothesis; a target-gate clear is not a full approval. Create exactly one concise daily reflection record. When calling create_reflection, set source_session_id to ${SOURCE_SESSION_ID}, period_start to ${RUN_DATE}, and period_end to ${RUN_DATE}. If today's evidence contains a concrete learning that can be tested safely, create at most one pending-review one-variable experiment proposal with the same source_session_id. Prefer proposal variables from the supported overlay list: execution.min_trade_value_dkk, strategy.capital.min_cash_buffer_pct, strategy.swing.cash_buffer_pct, strategy.swing.daily_indicators.min_confluences, strategy.swing.markov_gate.min_signed_signal. Do not duplicate an existing pending/active experiment for the same changed_variable_path. If create_experiment_proposal returns advisory related-family context, defer that relationship to operator review; do not merge, reject, or activate the different variable. If evidence is insufficient, record proposed_actions in the reflection instead of an experiment. Do not request or expose Saxo tokens, AccountKey, ClientKey, OAuth payloads, database credentials, or broker mutation endpoints.",
                    "instructions": "You are Hermes Agent acting as a daily EOD learning agent for the saxo-rust day/swing trading system. You may observe, write one reflection, and create at most one pending-review experiment proposal. You must not place, approve, replace, or cancel orders. You must not access /api/saxo/* or any Saxo session/token source. Use the configured daytrader MCP adapter or the protected /api/hermes/* adapter only.",
                    "metadata": {
                      "source": "kubernetes-cronjob",
                      "job": "hermes-daily-reflection",
                      "cadence": "daily"
                    }
                  }
                  EOF
                  curl -fsS \
                    -H "Authorization: Bearer ${API_SERVER_KEY}" \
                    -H "Content-Type: application/json" \
                    --data @/tmp/hermes-run.json \
                    http://hermes-gateway.saxo:8642/v1/runs
                  echo
                  sleep "${WAIT_SECONDS}"
                  if curl -fsS \
                    -H "Authorization: Bearer ${HERMES_DAYTRADER_API_KEY}" \
                    "${DAYTRADER_API_BASE_URL}/api/hermes/reflections?limit=20" \
                    | grep -F "\"source_session_id\":\"${SOURCE_SESSION_ID}\"" >/dev/null; then
                    echo "Hermes daily reflection recorded with source_session_id=${SOURCE_SESSION_ID}."
                    exit 0
                  fi
                  echo "Hermes daily run did not record source_session_id=${SOURCE_SESSION_ID}; writing watchdog reflection." >&2
                  cat > /tmp/hermes-watchdog-reflection.json <<EOF
                  {
                    "period_start": "${RUN_DATE}",
                    "period_end": "${RUN_DATE}",
                    "goal_version": 2,
                    "summary": "Daily reflection watchdog: Hermes run was submitted at ${RUN_STARTED_AT}, but no reflection with source_session_id ${SOURCE_SESSION_ID} was recorded within ${WAIT_SECONDS}s. Review Hermes gateway/model/MCP logs before trusting the daily reflection loop.",
                    "findings": [{"severity": "warning", "topic": "hermes_daily_reflection", "detail": "Scheduled Hermes run did not persist a daily reflection within the watchdog window."}],
                    "proposed_actions": [],
                    "source_session_id": "${SOURCE_SESSION_ID}",
                    "raw_payload": {"source": "kubernetes-cronjob-watchdog", "job": "hermes-daily-reflection", "submitted_at": "${RUN_STARTED_AT}"}
                  }
                  EOF
                  curl -fsS \
                    -H "Authorization: Bearer ${HERMES_DAYTRADER_API_KEY}" \
                    -H "Content-Type: application/json" \
                    --data @/tmp/hermes-watchdog-reflection.json \
                    "${DAYTRADER_API_BASE_URL}/api/hermes/reflections"
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-weekly-reflection
  labels:
    app: hermes-agent
    component: reflection
    cadence: weekly
spec:
  schedule: "15 22 * * 5"
  timeZone: Europe/Copenhagen
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: hermes-agent
            component: reflection
            cadence: weekly
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
            - name: submit-reflection
              image: curlimages/curl:8.17.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: hermes-env
                    optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -ec
                - |
                  if [ -z "${API_SERVER_KEY:-}" ]; then
                    echo "API_SERVER_KEY is required; set HERMES_API_SERVER_KEY in .env and redeploy." >&2
                    exit 1
                  fi
                  if [ -z "${HERMES_DAYTRADER_API_KEY:-}" ]; then
                    echo "HERMES_DAYTRADER_API_KEY is required for the daytrader adapter." >&2
                    exit 1
                  fi
                  DAYTRADER_API_BASE_URL="${DAYTRADER_API_BASE_URL:-http://daytrader-api.saxo:8000}"
                  RUN_DATE="$(date -u +%Y-%m-%d)"
                  RUN_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  SOURCE_SESSION_ID="weekly-reflection-${RUN_DATE}"
                  WAIT_SECONDS="${HERMES_REFLECTION_WAIT_SECONDS:-120}"
                  cat > /tmp/hermes-run.json <<EOF
                  {
                    "session_id": "saxo-daytrader-weekly-reflection",
                    "input": "Run the saxo daytrader weekly self-improvement learning and proposal loop. Prefer the configured daytrader MCP tools: get_context, get_decision_reports, get_end_of_day_reports, get_markov_signals, get_quiver_signals, list_experiments, create_reflection, and create_experiment_proposal. Analyze scheduler cycles, the two daily decision-report pulses, daily end-of-day reports, Markov regime signals, Quiver alternative-data signals, execution outcomes, failures, active baseline context, recent pending/active experiments, the read-only gate_replay evidence, and 1M performance against the goal contract. A target-gate clear in replay is not a full approval. Do not request or expose Saxo tokens, AccountKey, ClientKey, OAuth payloads, database credentials, or broker mutation endpoints. Create exactly one reflection record. When calling create_reflection, set source_session_id to ${SOURCE_SESSION_ID} and period_end to ${RUN_DATE}. Create one pending-review experiment proposal when the week contains a concrete evidence-backed learning and no duplicate pending/active proposal already covers the same changed_variable_path; otherwise record the best candidate as proposed_actions and explain the blocker. If create_experiment_proposal returns advisory related-family context, defer that relationship to operator review; do not merge, reject, or activate the different variable. Every experiment proposal must change exactly one variable and prefer supported overlay variables: execution.min_trade_value_dkk, strategy.capital.min_cash_buffer_pct, strategy.swing.cash_buffer_pct, strategy.swing.daily_indicators.min_confluences, strategy.swing.markov_gate.min_signed_signal. Keep all outputs concise and auditable.",
                    "instructions": "You are Hermes Agent acting as a research and proposal agent for the saxo-rust day/swing trading system. You may observe, write one reflection, and create one pending-review experiment proposal when evidence supports it. You must not place, approve, replace, or cancel orders. You must not access /api/saxo/* or any Saxo session/token source. Use the configured daytrader MCP adapter or the protected /api/hermes/* adapter only.",
                    "metadata": {
                      "source": "kubernetes-cronjob",
                      "job": "hermes-weekly-reflection"
                    }
                  }
                  EOF
                  curl -fsS \
                    -H "Authorization: Bearer ${API_SERVER_KEY}" \
                    -H "Content-Type: application/json" \
                    --data @/tmp/hermes-run.json \
                    http://hermes-gateway.saxo:8642/v1/runs
                  echo
                  sleep "${WAIT_SECONDS}"
                  if curl -fsS \
                    -H "Authorization: Bearer ${HERMES_DAYTRADER_API_KEY}" \
                    "${DAYTRADER_API_BASE_URL}/api/hermes/reflections?limit=20" \
                    | grep -F "\"source_session_id\":\"${SOURCE_SESSION_ID}\"" >/dev/null; then
                    echo "Hermes weekly reflection recorded with source_session_id=${SOURCE_SESSION_ID}."
                    exit 0
                  fi
                  echo "Hermes weekly run did not record source_session_id=${SOURCE_SESSION_ID}; writing watchdog reflection." >&2
                  cat > /tmp/hermes-watchdog-reflection.json <<EOF
                  {
                    "period_start": "",
                    "period_end": "${RUN_DATE}",
                    "goal_version": 2,
                    "summary": "Weekly reflection watchdog: Hermes run was submitted at ${RUN_STARTED_AT}, but no reflection with source_session_id ${SOURCE_SESSION_ID} was recorded within ${WAIT_SECONDS}s. Review Hermes gateway/model/MCP logs before trusting the weekly self-improvement loop.",
                    "findings": [{"severity": "warning", "topic": "hermes_weekly_reflection", "detail": "Scheduled Hermes run did not persist a weekly reflection within the watchdog window."}],
                    "proposed_actions": [],
                    "source_session_id": "${SOURCE_SESSION_ID}",
                    "raw_payload": {"source": "kubernetes-cronjob-watchdog", "job": "hermes-weekly-reflection", "submitted_at": "${RUN_STARTED_AT}"}
                  }
                  EOF
                  curl -fsS \
                    -H "Authorization: Bearer ${HERMES_DAYTRADER_API_KEY}" \
                    -H "Content-Type: application/json" \
                    --data @/tmp/hermes-watchdog-reflection.json \
                    "${DAYTRADER_API_BASE_URL}/api/hermes/reflections"
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
