apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  labels:
    app: hermes-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-daytrader-context
  labels:
    app: hermes-agent
data:
  DAYTRADER_CAPABILITIES.md: |
    # Daytrader Capabilities

    Hermes is running beside the `saxo-rust` day/swing trading app in the
    `saxo-rust` Kubernetes namespace.

    Hermes may observe, reflect, summarize, and propose changes. It must not
    directly place Saxo orders, approve live orders, read Saxo session tokens,
    mutate Kubernetes secrets, or activate strategies without the app's approval
    flow.

    Current app capabilities:

    - Rust Axum HTTP/API server and Dioxus SSR dashboard.
    - Rust scheduler heartbeat and xAI decision report polling.
    - Trading Manager queue creation from completed decision reports.
    - Saxo order precheck and placement for approved queued orders.
    - Strategy journal entries, scheduler cycles, execution orders, events, and
      fills persisted in the daytrader database.
    - Durable Saxo OAuth session storage in `saxo_sessions`, which Hermes must
      not read or expose.

    Useful internal endpoints:

    - `http://daytrader-api.saxo-rust:8000/api/health`
    - `http://daytrader-mcp.saxo-rust:8610/mcp`
    - `http://daytrader-api.saxo-rust:8000/api/overview`
    - `http://daytrader-api.saxo-rust:8000/api/hermes/capabilities`
    - `http://daytrader-api.saxo-rust:8000/api/hermes/context`
    - `http://daytrader-api.saxo-rust:8000/api/hermes/reflections`
    - `http://daytrader-api.saxo-rust:8000/api/hermes/experiments`
    - `http://daytrader-api.saxo-rust:8000/api/scheduler`
    - `http://daytrader-api.saxo-rust:8000/api/execution`
    - `http://daytrader-api.saxo-rust:8000/api/strategy-journal`

    The `/api/hermes/*` endpoints require `x-hermes-api-key` or
    `Authorization: Bearer ...` using `HERMES_DAYTRADER_API_KEY`.
    The `daytrader-mcp` endpoint uses the same bearer key and exposes only
    Hermes-safe tools.

    Read the repository wiki for maintained project knowledge:

    - `wiki/index.md`
    - `wiki/schema.md`
    - `docs/hermes-agent.md`
    - `docs/project-wiki.md`
  SELF_IMPROVEMENT_GOAL.yaml: |
    hermes_self_improvement:
      enabled: false
      mode: recommend_only
      goal_version: 1
      objective:
        target_return_30d: 0.47
        target_return_note: "Approximately 10x in 6 months if compounded monthly: 1.47^6 ~= 10.1"
        max_drawdown: 0.20
        min_sharpe: 1.0
        failure_below_30d_return: -0.04
        reflection_every: 7d
        one_variable_only: true
      constraints:
        max_positions: 25
        slippage_tolerance: 0.02
        gas_reserve: 0.05
        min_cash_buffer_pct: 0.10
        allow_shorting: false
        require_human_approval: true
        require_backtest_before_activation: true
        require_paper_or_sim_observation: true
      forbidden:
        - read_saxo_sessions
        - expose_tokens_or_account_keys
        - place_or_approve_live_orders
        - mutate_kubernetes_secrets
        - activate_strategy_without_approval
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytrader-mcp
  labels:
    app: daytrader-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daytrader-mcp
  template:
    metadata:
      labels:
        app: daytrader-mcp
    spec:
      containers:
        - name: mcp
          image: daytrader-api:local
          imagePullPolicy: IfNotPresent
          command:
            - /app/saxo-rust
            - --mcp-http
          env:
            - name: DAYTRADER_CONFIG
              value: /app/config/config.yaml
            - name: BIND_ADDR
              value: 0.0.0.0:8610
            - name: SAXO_SESSION_PATH
              value: /tmp/daytrader/saxo_session.json
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daytrader-postgres-app
                  key: database-url
          envFrom:
            - secretRef:
                name: daytrader-env
                optional: true
          ports:
            - name: mcp
              containerPort: 8610
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: daytrader-config
        - name: tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: daytrader-mcp
  labels:
    app: daytrader-mcp
spec:
  selector:
    app: daytrader-mcp
  ports:
    - name: mcp
      port: 8610
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      securityContext:
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-daytrader-mcp
          image: curlimages/curl:8.17.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 60); do
                if curl -fsS http://daytrader-mcp.saxo-rust:8610/health >/dev/null; then
                  exit 0
                fi
                sleep 2
              done
              echo "daytrader-mcp did not become ready before Hermes startup" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          envFrom:
            - secretRef:
                name: hermes-env
                optional: true
          ports:
            - name: gateway
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -lc
                  - |
                    if [ -n "${HERMES_MODEL:-}" ]; then
                      /opt/hermes/.venv/bin/python /opt/hermes/hermes config set model.default "$HERMES_MODEL" || true
                    fi
                    if [ -n "${HERMES_INFERENCE_PROVIDER:-}" ]; then
                      /opt/hermes/.venv/bin/python /opt/hermes/hermes config set model.provider "$HERMES_INFERENCE_PROVIDER" || true
                    fi
                    if [ -n "${HERMES_DAYTRADER_API_KEY:-}" ]; then
                      /opt/hermes/.venv/bin/python - <<'PY' || true
                    import os
                    from pathlib import Path

                    import yaml

                    path = Path("/opt/data/config.yaml")
                    data = {}
                    if path.exists():
                        data = yaml.safe_load(path.read_text()) or {}
                    servers = data.setdefault("mcp_servers", {})
                    servers["daytrader"] = {
                        "url": os.environ.get("DAYTRADER_MCP_URL", "http://daytrader-mcp.saxo-rust:8610/mcp"),
                        "headers": {
                            "Authorization": f"Bearer {os.environ['HERMES_DAYTRADER_API_KEY']}"
                        },
                        "timeout": 30,
                        "connect_timeout": 5,
                        "supports_parallel_tool_calls": False,
                        "tools": {
                            "include": [
                                "get_app_capabilities",
                                "get_goal_contract",
                                "get_context",
                                "list_reflections",
                                "create_reflection",
                                "list_experiments",
                                "create_experiment_proposal",
                            ],
                            "resources": False,
                            "prompts": False,
                        },
                    }
                    path.write_text(yaml.safe_dump(data, sort_keys=False))
                    PY
                    fi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: dev-shm
              mountPath: /dev/shm
            - name: daytrader-context
              mountPath: /opt/daytrader-context
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: tmp
          emptyDir: {}
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: daytrader-context
          configMap:
            name: hermes-daytrader-context
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-gateway
  labels:
    app: hermes-agent
spec:
  selector:
    app: hermes-agent
  ports:
    - name: gateway
      port: 8642
      targetPort: gateway
    - name: dashboard
      port: 9119
      targetPort: dashboard
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-weekly-reflection
  labels:
    app: hermes-agent
    component: reflection
spec:
  schedule: "15 22 * * 5"
  timeZone: Europe/Copenhagen
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: hermes-agent
            component: reflection
        spec:
          restartPolicy: Never
          containers:
            - name: submit-reflection
              image: curlimages/curl:8.17.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: hermes-env
                    optional: true
              command:
                - /bin/sh
                - -ec
                - |
                  if [ -z "${API_SERVER_KEY:-}" ]; then
                    echo "API_SERVER_KEY is required; set HERMES_API_SERVER_KEY in .env and redeploy." >&2
                    exit 1
                  fi
                  if [ -z "${HERMES_DAYTRADER_API_KEY:-}" ]; then
                    echo "HERMES_DAYTRADER_API_KEY is required for the daytrader adapter." >&2
                    exit 1
                  fi
                  DAYTRADER_API_BASE_URL="${DAYTRADER_API_BASE_URL:-http://daytrader-api.saxo-rust:8000}"
                  cat > /tmp/hermes-run.json <<EOF
                  {
                    "session_id": "saxo-daytrader-weekly-reflection",
                    "input": "Run the saxo daytrader weekly self-improvement reflection. Prefer the configured daytrader MCP tools: get_context, create_reflection, and create_experiment_proposal. Analyze scheduler cycles, decision reports, strategy journals, execution outcomes, failures, active baseline context, and 1M performance against the goal contract. Do not request or expose Saxo tokens, AccountKey, ClientKey, OAuth payloads, database credentials, or broker mutation endpoints. Create exactly one reflection record. If evidence is sufficient, create at most one experiment proposal and change exactly one variable. If evidence is insufficient, record no experiment. Keep all outputs concise and auditable.",
                    "instructions": "You are Hermes Agent acting as a research/reflection agent for the saxo-rust day/swing trading system. You may observe and propose only. You must not place, approve, replace, or cancel orders. You must not access /api/saxo/* or any Saxo session/token source. Use the configured daytrader MCP adapter or the protected /api/hermes/* adapter only.",
                    "metadata": {
                      "source": "kubernetes-cronjob",
                      "job": "hermes-weekly-reflection"
                    }
                  }
                  EOF
                  curl -fsS \
                    -H "Authorization: Bearer ${API_SERVER_KEY}" \
                    -H "Content-Type: application/json" \
                    --data @/tmp/hermes-run.json \
                    http://hermes-gateway.saxo-rust:8642/v1/runs
