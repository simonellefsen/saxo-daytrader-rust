apiVersion: batch/v1
kind: CronJob
metadata:
  name: daytrader-postgres-backup-schedule
spec:
  schedule: "0,30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: daytrader-backup-retention
          restartPolicy: Never
          containers:
            - name: backup
              image: daytrader-backup:local
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /app/scripts/create_postgres_backup.py
              env:
                - name: CLUSTER_NAME
                  value: daytrader-postgres
