apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saxo-rust

resources:
  - namespace.yaml
  - api.yaml
  - scheduler.yaml
  - hermes.yaml

configMapGenerator:
  - name: daytrader-config
    files:
      - config.yaml=config.k8s.yaml

generatorOptions:
  disableNameSuffixHash: true
