apiVersion: v1
kind: ServiceAccount
metadata:
  name: daytrader-backup-retention
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: daytrader-backup-retention
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
    verbs:
      - create
      - get
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: daytrader-backup-retention
subjects:
  - kind: ServiceAccount
    name: daytrader-backup-retention
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: daytrader-backup-retention
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daytrader-postgres-backup-retention
spec:
  schedule: "5,35 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: daytrader-backup-retention
          restartPolicy: Never
          containers:
            - name: retention
              image: daytrader-backup:local
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /app/scripts/prune_postgres_backups.py
              env:
                - name: CLUSTER_NAME
                  value: daytrader-postgres
                # Retention is the only process that sees both CNPG's completed
                # Backup resources and whether their objects reached the bucket,
                # so it publishes a base-backup heartbeat the application can
                # read. The application has no Kubernetes access and so cannot
                # observe base backups any other way. Writing that heartbeat is
                # best-effort and never fails the retention pass.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: daytrader-postgres-app
                      key: database-url
                - name: BACKUP_BUCKET
                  value: daytrader-cnpg
                # WAL older than the oldest kept base backup serves no restore,
                # and base retention never removed it: 7.9 GB of the 8.5 GB
                # bucket on 2026-10-18. `dry_run` reports what would go in the
                # job log (`wal_pruning`); `delete` removes it. Deletion is
                # permanent, so switching to `delete` is the operator's call.
                - name: WAL_PRUNE
                  value: dry_run
                - name: S3_ENDPOINT_URL
                  value: http://host.docker.internal:9000
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: daytrader-minio-backup
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: daytrader-minio-backup
                      key: ACCESS_SECRET_KEY
