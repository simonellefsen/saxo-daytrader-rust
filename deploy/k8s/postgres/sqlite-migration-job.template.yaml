apiVersion: batch/v1
kind: Job
metadata:
  name: daytrader-sqlite-to-postgres-migration
  namespace: saxo
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: __API_IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - python
            - scripts/migrate_sqlite_to_postgres.py
            - --source
            - /data/ledger.db
          env:
            - name: PYTHONPATH
              value: /app/src
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daytrader-postgres-app
                  key: database-url
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: daytrader-data
