price_monitor:
  enabled: true
  poll_interval_minutes: 1
  off_hours_poll_interval_minutes: 15
  post_close_grace_minutes: 15
  reset_hour_local: 6
  timezone: Europe/Copenhagen
  history_max_rows: 0
  history_retention_days: 0

analysis_windows:
  offset_minutes_after_open: 30
  duration_minutes: 0
  pre_sync_minutes_before_analysis: 5
  end_buffer_minutes_before_close: 15
  calendar_refresh_interval_minutes: 360
  calendar_lookback_days: 7
  calendar_lookahead_days: 45

scheduler:
  enabled: true
  poll_interval_minutes: 10
  startup_run: true
  history_max_rows: 250
  history_retention_days: 30

strategy:
  # Read-only comparison of the account value series with Saxo-resolved ETF
  # proxies. These are price returns, not index total returns: no dividends,
  # FX-normalization, or cash-flow adjustment is claimed. They are deliberately
  # outside Decision Reports, Hermes, Trading Manager, and broker execution.
  performance_benchmarks:
    enabled: true
    timezone: Europe/Copenhagen
    daily_time: "23:55"
    run_weekdays_only: true
    sample_count: 1260
    references:
      - key: us_large_cap
        label: S&P 500 (SPY ETF proxy)
        symbol: SPY:arcx
      - key: us_technology
        label: Nasdaq-100 (QQQ ETF proxy)
        symbol: QQQ:xnas
      - key: us_blue_chip
        label: Dow Jones Industrial Average (DIA ETF proxy)
        symbol: DIA:arcx
      - key: global_equity
        label: MSCI World (EUNL ETF proxy)
        symbol: EUNL:xetr
      - key: europe_broad
        label: STOXX Europe 600 (EXSA ETF proxy)
        symbol: EXSA:xetr
      - key: uk_large_cap
        label: FTSE 100 (ISF ETF proxy)
        symbol: ISF:xlon
  enabled: true
  mode: swing
  max_candidates: 20
  max_selected_assets: 8
  # Exchange/currency concentration gates are wired and audited, but start in
  # explicit unlimited mode until an operator chooses live limits. Nonzero
  # values cap distinct held/planned BUY symbols; negative values fail BUYs
  # closed rather than weakening diversification evidence.
  concentration:
    max_assets_per_exchange: 0
    max_assets_per_currency: 0
  # BUYs require a verified indicator target to clear the exchange-minimum
  # round-trip commission plus this one-way slippage estimate. This is a
  # lower-bound cost model, not a realised-fill forecast.
  estimated_slippage_bps: 8
  # Multiplies the round-trip minimum commission in the same BUY cost guard.
  # Zero disables only this commission multiplier; invalid negative values
  # fail closed during queueing.
  cost_guard_multiple: 1.5
  capital:
    max_deployment_pct: 0.98
    min_cash_buffer_pct: 0.02
    reinvestment_pressure_threshold_pct: 0.05
    # Reduce the cycle-wide BUY budget while the monthly P/L is between this
    # floor and the hard halt. It must be a less-severe negative number than
    # monthly_loss_halt_dkk; invalid/disabled bands do not reduce deployment.
    # Rescaled 2026-07-25 against the +15%/year goal on a ~300,000 DKK book.
    # The previous -25,000/-50,000 pair was -8.2%/-16.4% of the portfolio in a
    # single month, so one bad month could erase roughly a year of target gains
    # before the hard halt fired. Now -3% soft and -6% hard, same 2:1 ratio.
    monthly_loss_soft_reduce_dkk: -9000
    monthly_loss_soft_buy_multiplier: 0.50
    # Suspend new BUYs when month P/L (goal-tracking baseline) breaches this
    # hard floor; SELLs are never blocked. Set >= 0 to disable both loss tiers.
    monthly_loss_halt_dkk: -18000
    # Portfolio drawdown guardrail. Unlike the monthly floors above, this does
    # not reset on the 1st: it measures the current total portfolio value
    # against its highest value in the trailing window, so a decline that
    # straddles a month boundary stays visible. drawdown_halt_pct is the same
    # number the Hermes goal contract publishes as max_drawdown; the contract
    # reads this key, so the two cannot drift apart. Set <= 0 to disable both
    # tiers. Too little history disables the guardrail rather than tripping it.
    drawdown_lookback_days: 90
    drawdown_soft_reduce_pct: 0.10
    drawdown_soft_buy_multiplier: 0.50
    drawdown_halt_pct: 0.20
  markov:
    enabled: true
    timezone: Europe/Copenhagen
    daily_time: "23:30"
    run_weekdays_only: true
    window_days: 20
    threshold: 0.05
    horizon_minutes: 1440
    sample_count: 520
    min_labeled_days: 60
    signal_horizon_days: 5
    forecast_steps: [1, 2, 3, 5, 10]
    max_symbols: 0
    instrument_negative_cache_retry_days: 7
    # Read-only analysis aliases for stale portfolio/watchlist symbols. These
    # are used only for Markov/daily-indicator Saxo chart lookup; persisted
    # signals remain keyed by the original symbol.
    symbol_aliases:
      "COST:xnys": "COST:xnas"
      "HON:xnys": "HON:xnas"
      "LIN:xnys": "LIN:xnas"
      "SHELL:xlon": "SHEL:xlon"
  # Keep local scheduler behavior aligned with the deployed advisory-data
  # collection policy. The Quiver API key remains environment-backed.
  quiver:
    enabled: true
    timezone: Europe/Copenhagen
    # Follow the Saxo US exchange calendar so this completes before the
    # US Open +1h15 Decision Report despite holidays and daylight saving.
    us_open_followup:
      minutes_after_open: 45
      exchange_codes: [XNAS, XNYS]
    run_weekdays_only: true
    lookback_days: 120
    max_symbols: 60
  swing:
    min_holdings: 10
    max_holdings: 25
    # Decision chips are advisory context, not evergreen instructions. Mark
    # report-derived symbols stale after this many days in the dashboard.
    position_decision_stale_after_days: 7
    # Maximum estimated initial loss for a BUY at its automatic ATR stop.
    # Uses a database-verified close, ATR14, and DKK share value; missing
    # evidence fails the BUY closed rather than trusting model-provided data.
    risk_per_trade_pct: 0.01
    never_trade_symbols: []
    daily_indicators:
      enabled: true
      # 0 = full portfolio+watchlist universe (matches the Markov run, ~199
      # symbols). A small cap starves BUY candidates of confluence evidence:
      # the technical gate and Hermes then stand down every rotation into a
      # name outside current holdings.
      max_symbols: 0
      horizon_minutes: 1440
      # Five daily trading years. The support-risk projection reports how much
      # of this target was actually returned, rather than assuming full history.
      sample_count: 1260
      min_confluences: 3
      min_reward_risk: 2.0
      daily_time: "23:45"
      run_weekdays_only: true
      timezone: Europe/Copenhagen
    markov_gate:
      enabled: true
      min_signed_signal: 0.15
      max_position_pct: 0.05
      max_signal_age_days: 5
    trading_manager:
      enabled: true
      use_ai: true
      due_window_minutes: 20
      # A scheduled report older than this is not eligible to create new
      # execution orders. Keep this explicit so the queue freshness policy
      # cannot silently drift from the Rust default.
      max_report_age_hours: 6
      # Maximum distinct report symbols evaluated per Decision Report in report
      # order. Additional symbols remain visible as skipped audit rows. Set 0
      # for explicit unlimited mode; a negative value fails closed.
      max_symbols: 30
    journal:
      enabled: true
      timezone: Europe/Copenhagen
      daily_time: "22:30"
      weekly_weekday: 6
      weekly_time: "20:00"
      monthly_time: "22:45"
    analysis_pulses:
      timezone: Europe/Copenhagen
      due_window_minutes: 20
      europe_open_followup:
        enabled: true
        minutes_after_open: 75
        exchange_codes: [XCSE, XSTO, XOSL, XHEL, XLON, XETR, XFRA, XMIL, XAMS]
      us_open_followup:
        enabled: true
        minutes_after_open: 75
        exchange_codes: [XNAS, XNYS]
  ladder:
    rung_count: 5
    min_rung_value_dkk: 5000
    submit_stop_loss_after_fill: true
    atr_spacing_min: 0.15
    atr_spacing_factor: 0.25
    atr_spacing_max: 0.4
    stop_loss_atr_multiple: 2.0
    take_profit_rung_multiple: 2.0
    max_take_profit_atr_multiple: 8.0
    # Hard cap for total exposure to one symbol after a BUY. The Trading
    # Manager uses persisted position value plus BUYs already approved in the
    # same scheduler cycle; missing or invalid exposure data blocks the BUY.
    max_position_weight: 0.04
    trail_stop_atr_multiple: 2.0
    min_ratchet_atr_fraction: 0.25

execution:
  #mode: simulation
  mode: live
  adapter: saxo
  auto_execute_simulation: true
  #require_approval_live: true
  require_approval_live: false
  min_trade_value_dkk: 500
  # BUYs must be large enough that the exchange minimum commission stays
  # under this share of the clip (0.003 = 0.3% per side). 0 disables.
  max_commission_pct_per_side: 0.003
  max_daily_orders: 50
  delayed_price_limit_orders:
    enabled: true
    assumed_delay_minutes: 15
    buy_limit_offset_bps: 20
    sell_limit_offset_bps: 20
    replace_threshold_bps: 10
    max_replacements_per_cycle: 25
  price_tick_overrides:
    MATAS:xcse: 0.5
    NKT:xcse: 0.5

risk:
  excluded_symbols: []
  excluded_symbols_csv: ENV:RISK_EXCLUDED_SYMBOLS
  instrument_quarantine:
    enabled: true
    lookback_days: 14
    min_failures: 3
    active_days: 14
  allow_shorting: false

taxation:
  share_income:
    currency: DKK
    brackets:
      - up_to_dkk: 79000
        rate: 0.27
      - up_to_dkk:
        rate: 0.42

commissions:
  default_rate: 0.0008
  fx_conversion_rate: 0.0025
  minimums:
    XCSE:
      currency: DKK
      amount: 14.0
    XNAS:
      currency: USD
      amount: 3.0
    XNYS:
      currency: USD
      amount: 3.0
    XLON:
      currency: GBP
      amount: 3.0
    XMIL:
      currency: EUR
      amount: 3.0

xai:
  provider: openrouter
  api_key: ENV:OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-5.5
  reasoning_effort: medium
  max_output_tokens: 8192
  http_timeout_seconds: 600
  performance_goals:
    currency: DKK
    week_start_weekday: 0
    week_end_weekday: 4
    # Sized to roughly +15% per year on a ~300,000 DKK book (2026-07-25).
    # Revisit these DKK figures when the portfolio value changes materially,
    # otherwise the implied percentage target drifts silently.
    weekly_target_dkk: 880
    monthly_target_dkk: 3800
    stretch_weekly_target_dkk: 1200
  goal: >
    Target approximately +15% portfolio growth per year before tax, which is
    about DKK 880 per Monday-Friday trading week and DKK 3,800 per calendar
    month on the current book. Preserve capital first: a steady, disciplined
    swing horizon beats chasing the target in any single week.
  timeout_seconds: 600
  retry_initial_backoff_seconds: 60
  retry_max_backoff_seconds: 600
  auto_run_interval_minutes: 240
  include_encrypted_reasoning: false

saxo:
  environment: SIM
  client_id: ENV:SAXO_CLIENT_ID
  client_secret: ENV:SAXO_CLIENT_SECRET
  client_key: ENV:SAXO_CLIENT_KEY
  account_key: ENV:SAXO_ACCOUNT_KEY
  session_path: /tmp/daytrader/saxo_session.json
  # Requests per minute per Saxo service group (the first path segment: chart,
  # port, trade, ref). Saxo documents roughly 120 per session per group; this
  # sits under it because the ceiling is where rejection starts, not where it
  # is safe to sit. Clamped to 120 in code. The pacer also reads the
  # X-RateLimit-* response headers and tightens on its own as quota depletes.
  requests_per_minute: 100

tradingview:
  username: ENV:TRADINGVIEW_USERNAME
  encrypted_password: ENV:TRADINGVIEW_PASSWORD
  totp_secret: ENV:TRADINGVIEW_TOTP_SECRET

openfigi:
  enabled: true
  api_key: ENV:OPENFIGI_API_KEY
  base_url: https://api.openfigi.com/v3
  timeout_seconds: 10

hermes:
  experiments:
    # Alerts begin after 14 days; proposals not reviewed after 30 days are
    # closed as expired_stale without changing a strategy baseline or runtime.
    auto_expire_pending_review_enabled: true
    auto_expire_pending_review_days: 30

notifications:
  daily_summary_enabled: false
  weekly_summary_enabled: false
  monthly_summary_enabled: false
  quarterly_summary_enabled: false
  ytd_summary_enabled: false
  timezone: Europe/Copenhagen
  dispatch_hour_local: 18
  dispatch_minute_local: 15
  weekly_dispatch_weekday_local: 0
  monthly_dispatch_day_local: 1
  quarterly_dispatch_day_local: 1
  ytd_dispatch_day_local: 1
  retry_backoff_minutes: 30
  max_attempts_per_day: 3
  channel_cooldown_minutes: 240
  summary_style: structured
  slack:
    enabled: true
    webhook_url: ENV:SLACK_WEBHOOK_URL
  email:
    enabled: false
    smtp_host: ENV:SMTP_HOST
    smtp_port: ENV:SMTP_PORT
    use_starttls: true
    username: ENV:SMTP_USERNAME
    password: ENV:SMTP_PASSWORD
    from_address: ENV:SMTP_FROM_ADDRESS
    to_addresses_csv: ENV:SMTP_TO_ADDRESSES
  alerts:
    execution_success_enabled: true
    execution_warning_enabled: true
    broker_fill_enabled: false
    broker_reject_enabled: false
    broker_cancel_enabled: false
    execution_failure_enabled: true
    broker_management_failure_enabled: true
    saxo_session_failure_enabled: true
    operational_alerts_enabled: true
    decision_failure_enabled: true
    decision_failure_threshold: 2
    decision_failure_window_hours: 24
    execution_failure_burst_enabled: true
    execution_failure_burst_threshold: 3
    execution_failure_burst_window_hours: 24
    drawdown_guardrail_alert_enabled: true
    scheduler_stale_enabled: true
    scheduler_stale_minutes: 30
    hermes_eod_reflection_missed_enabled: true
    hermes_eod_reflection_due_hour_utc: 22
    hermes_pending_experiment_review_enabled: true
    hermes_pending_experiment_review_stale_days: 14
    hermes_pending_experiment_review_limit: 10
    # One compact operator review list after the weekly reflection cycle.
    # Weekdays use ISO numbering: Monday=1 through Sunday=7.
    hermes_pending_experiment_review_digest_enabled: true
    hermes_pending_experiment_review_digest_weekday_local: 1
    hermes_pending_experiment_review_digest_hour_local: 9
    hermes_pending_experiment_review_digest_limit: 10
  alert_suppression:
    enabled: true
    low_cooldown_minutes: 240
    medium_cooldown_minutes: 60
    high_cooldown_minutes: 0
  alert_grouping:
    enabled: true
    max_items_per_group: 5
  route_profiles: {}
  routes:
    daily: {}
    weekly: {}
    monthly: {}
    quarterly: {}
    ytd: {}
    alert_execution_success: {}
    alert_execution_warning: {}
    alert_broker_fill: {}
    alert_broker_reject: {}
    alert_broker_cancel: {}
    alert_broker_grouped: {}
    alert_execution_failed: {}
    alert_broker_management_failed: {}
    alert_saxo_session_failed: {}
    alert_operational_issue: {}
